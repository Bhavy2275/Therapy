        value: sb_publishable_6KL1mmS9kxtpyUH-LHfOpQ_xP7NAj4Q
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_URL
        value: https://vxzgjbuyytcnincgyyon.supabase.co
